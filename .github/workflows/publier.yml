name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pillow==11.0.0 pillow-heif==0.20.0
      - name: Contrôle des fichiers de contenu
        run: for f in content/*.json content/pages/*.json src/media.json; do python3 -m json.tool "$f" > /dev/null || { echo "Fichier invalide: $f"; exit 1; }; done
      - name: Photos (s'arrête si une photo manque ou est illisible)
        run: python3 scripts/optimize_images.py
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
